    <rect x="238" y="144" width="20" height="16" rx="3"/><rect x="266" y="144" width="20" height="16" rx="3"/><rect x="294" y="144" width="20" height="16" rx="3"/>
    <rect x="238" y="176" width="20" height="16" rx="3"/><rect x="266" y="176" width="20" height="16" rx="3"/><rect x="294" y="176" width="20" height="16" rx="3"/>
    <rect x="238" y="208" width="20" height="16" rx="3"/><rect x="266" y="208" width="20" height="16" rx="3"/><rect x="294" y="208" width="20" height="16" rx="3"/>
    <rect x="354" y="182" width="20" height="16" rx="3"/><rect x="384" y="182" width="20" height="16" rx="3"/>
    <rect x="354" y="214" width="20" height="16" rx="3"/><rect x="384" y="214" width="20" height="16" rx="3"/>
    <rect x="354" y="246" width="20" height="16" rx="3"/><rect x="384" y="246" width="20" height="16" rx="3"/>
